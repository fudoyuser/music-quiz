<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Quiz kiến thức âm nhạc theo từng ca sĩ và bài hát: nội dung, giọng điệu và bối cảnh MV.">
<title>Đố Vui Giai Điệu</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,700;1,9..144,500&family=Oswald:wght@500;700&family=Playfair+Display:ital,wght@0,700;1,500;1,700&family=Be+Vietnam+Pro:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: một cột như bìa album. Mỗi ca sĩ mang bảng màu riêng (data-theme); trang chủ là phòng thu tối */
:root, [data-theme="home"] {
  --bg: #111018; --bg-art: radial-gradient(1100px 480px at 50% -10%, #3b2d6a66, transparent 70%);
  --card: #1b1925; --opt: #23202f; --ink: #f3f0fa; --muted: #a39db3; --line: #322d40;
  --accent: #8f7bff; --accent-ink: #ffffff; --accent2: #ff7ab6;
  --ok: #5fd0a0; --ok-soft: #173a2e; --no: #ff7a6b; --no-soft: #3d1d1c;
  --display: "Fraunces", Georgia, serif;
  color-scheme: dark;
}
[data-theme="son-tung"] {
  --bg: #0d0b0a;
  --bg-art: radial-gradient(800px 420px at 50% -8%, #e2b65a30, transparent 70%), radial-gradient(600px 400px at 100% 100%, #b5302a22, transparent 70%);
  --card: #171412; --opt: #201b18; --ink: #f6efe4; --muted: #ab9f90; --line: #2f2822;
  --accent: #e2b65a; --accent-ink: #1a1305; --accent2: #d0463b;
  --ok: #7fd3a4; --ok-soft: #173329; --no: #ff7d6b; --no-soft: #3b1a16;
  --display: "Oswald", "Arial Narrow", sans-serif;
  color-scheme: dark;
}
[data-theme="hoang-thuy-linh"] {
  --bg: #fff6ec;
  --bg-art: radial-gradient(700px 420px at 100% 0%, #ffc9a8aa, transparent 70%), radial-gradient(640px 420px at 0% 100%, #b7e6d6aa, transparent 70%);
  --card: #ffffff; --opt: #fff8f1; --ink: #3b1f16; --muted: #8a6a5c; --line: #f2dccb;
  --accent: #d9452b; --accent-ink: #ffffff; --accent2: #1f8a74;
  --ok: #23845f; --ok-soft: #ddf1e7; --no: #c43d2e; --no-soft: #fbe2dc;
  --display: "Fraunces", Georgia, serif;
  color-scheme: light;
}
[data-theme="taylor-swift"] {
  --bg: #f4f1fb;
  --bg-art: radial-gradient(700px 420px at 0% 0%, #d9ccf5cc, transparent 70%), radial-gradient(640px 420px at 100% 100%, #f8cfe0aa, transparent 70%);
  --card: #ffffff; --opt: #faf8ff; --ink: #231b3a; --muted: #6f6688; --line: #e3dcf2;
  --accent: #6b4fd8; --accent-ink: #ffffff; --accent2: #d6457e;
  --ok: #2f8a63; --ok-soft: #e0f2e9; --no: #c8423a; --no-soft: #fbe3e0;
  --display: "Playfair Display", Georgia, serif;
  color-scheme: light;
}
[data-theme="adele"] {
  --bg: #0e0e0f;
  --bg-art: radial-gradient(900px 420px at 50% -10%, #ffffff14, transparent 70%);
  --card: #171718; --opt: #1e1e20; --ink: #f2f2f0; --muted: #9d9d99; --line: #2c2c2e;
  --accent: #c9a26b; --accent-ink: #141009; --accent2: #8a8a86;
  --ok: #8fd1a8; --ok-soft: #1b3226; --no: #f08b7c; --no-soft: #3a1f1b;
  --display: "Playfair Display", Georgia, serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html { background: var(--bg); }
body {
  margin: 0; min-height: 100vh;
  background: var(--bg-art), var(--bg); background-attachment: fixed;
  color: var(--ink); font-family: "Be Vietnam Pro", system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 16px; line-height: 1.6;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 32px 64px;
  transition: background-color .4s, color .4s;
}
[hidden] { display: none !important; }
.wrap { max-width: 760px; margin: 0 auto; display: grid; gap: 32px; }
h1, h2, h3 { font-family: var(--display); font-weight: 700; line-height: 1.15; text-wrap: balance; margin: 0; }
[data-theme="son-tung"] h1, [data-theme="son-tung"] h3 { text-transform: uppercase; letter-spacing: .01em; }
.label { font-family: "JetBrains Mono", ui-monospace, Menlo, monospace; font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, a:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

/* Masthead */
.mast { display: grid; gap: 8px; }
.mast h1 { font-size: clamp(36px, 8vw, 58px); font-family: "Fraunces", Georgia, serif; }
.mast h1 em { font-style: italic; font-weight: 500; color: var(--accent); }
.mast p { margin: 0; color: var(--muted); max-width: 58ch; }
.legend { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 6px; }
body:not([data-theme="home"]) .mast { display: none; }

/* Nhãn nhóm câu hỏi */
.tag { font-family: "JetBrains Mono", ui-monospace, monospace; font-size: 11px; letter-spacing: .06em; text-transform: uppercase; padding: 3px 9px; border-radius: 99px; border: 1px solid var(--line); color: var(--muted); white-space: nowrap; }
.tag.nd::before, .tag.gd::before, .tag.mv::before { margin-right: 6px; }
.tag.nd::before { content: "✎"; }
.tag.gd::before { content: "♪"; }
.tag.mv::before { content: "▶"; }

/* Kệ ca sĩ: mỗi thẻ là một chiếc đĩa than mang màu của ca sĩ */
.shelf { display: grid; gap: 16px; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); }
.artist {
  position: relative; overflow: hidden; text-align: left; color: var(--ink);
  background: var(--bg-art), var(--card); border: 1px solid var(--line); border-radius: 18px;
  padding: 0; display: grid; grid-template-rows: auto 1fr; transition: transform .2s, box-shadow .2s;
}
.artist:hover { transform: translateY(-3px); box-shadow: 0 14px 40px -18px var(--accent); }
.cover { height: 128px; position: relative; border-bottom: 1px solid var(--line); background: var(--opt); overflow: hidden; }
.vinyl {
  position: absolute; width: 150px; height: 150px; right: -28px; top: -11px; border-radius: 50%;
  background: radial-gradient(circle, var(--accent) 0 15%, #0b0b0d 16% 18%, transparent 19%), repeating-radial-gradient(circle, #141416 0 2px, #1f1f22 2px 4px);
  box-shadow: 0 0 0 1px #00000040; transition: transform 1.2s ease;
}
.artist:hover .vinyl { transform: rotate(180deg); }
.cover .initial { position: absolute; left: 20px; bottom: 12px; font-family: var(--display); font-size: 44px; line-height: 1; color: var(--accent); }
.artist .body { padding: 18px 20px 20px; display: grid; gap: 6px; align-content: start; }
.artist h3 { font-size: 25px; }
.artist .meta { font-size: 14px; color: var(--muted); }
.row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 4px; }
.pill { font-family: "JetBrains Mono", ui-monospace, monospace; font-size: 12px; padding: 3px 10px; border-radius: 99px; background: var(--accent); color: var(--accent-ink); }
.pill.ok { background: var(--ok-soft); color: var(--ok); }
.pill.soft { background: transparent; border: 1px solid var(--line); color: var(--muted); }
.artist.soon { cursor: default; border-style: dashed; background: transparent; }
.artist.soon:hover { transform: none; box-shadow: none; }
.artist.soon .cover { background: transparent; display: grid; place-items: center; font-size: 36px; color: var(--muted); }
.artist.soon h3 { color: var(--muted); font-weight: 500; font-style: italic; font-size: 20px; }

/* Trang ca sĩ */
.page { display: grid; gap: 22px; }
.topbar { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
.back { background: none; border: 0; padding: 0; color: var(--muted); font-size: 14px; }
.back:hover { color: var(--accent); }
.hero { display: grid; gap: 6px; }
.hero h1 { font-size: clamp(36px, 8vw, 56px); }
[data-theme="son-tung"] .hero h1 { font-size: clamp(44px, 10vw, 72px); }
.hero p { margin: 0; color: var(--muted); }
.filter { display: grid; gap: 10px; }
.chips { display: flex; gap: 8px; flex-wrap: wrap; }
.chip { border: 1.5px solid var(--line); background: var(--opt); border-radius: 99px; padding: 7px 14px; font-size: 14px; color: var(--ink); }
.chip:hover { border-color: var(--accent); }
.chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 600; }
.chip small { opacity: .7; margin-left: 4px; font-variant-numeric: tabular-nums; }
.tracks { display: grid; gap: 10px; margin: 0; padding: 0; list-style: none; }
.song {
  width: 100%; display: grid; grid-template-columns: 44px 1fr auto; gap: 14px; align-items: center; text-align: left;
  background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px; transition: border-color .15s, transform .15s;
}
.song:hover { border-color: var(--accent); transform: translateX(2px); }
.song .no { font-family: "JetBrains Mono", ui-monospace, monospace; font-size: 13px; color: var(--accent); width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; border: 1px solid var(--line); background: var(--opt); }
.song h3 { font-size: 21px; }
.song .sub { font-size: 13px; color: var(--muted); }
.song .go { font-size: 13px; color: var(--muted); white-space: nowrap; }

/* Quiz */
.trk { display: grid; grid-auto-flow: column; gap: 3px; }
.trk span { height: 6px; border-radius: 3px; background: var(--line); }
.trk span.ok { background: var(--ok); }
.trk span.no { background: var(--no); }
.trk span.now { background: var(--accent); }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 20px; padding: clamp(20px, 5vw, 36px); display: grid; gap: 20px; box-shadow: 0 20px 50px -30px color-mix(in srgb, var(--accent) 60%, transparent); }
.qhead { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
.qhead .left { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.num, .score { font-family: "JetBrains Mono", ui-monospace, monospace; font-size: 13px; font-variant-numeric: tabular-nums; }
.num { color: var(--accent); }
.score { color: var(--muted); }
.q { font-size: clamp(22px, 4.5vw, 28px); font-family: "Fraunces", Georgia, serif; font-weight: 700; }
.opts { display: grid; gap: 10px; }
.opt {
  display: grid; grid-template-columns: 32px 1fr; gap: 12px; align-items: center; text-align: left;
  background: var(--opt); border: 1.5px solid var(--line); border-radius: 12px; padding: 12px 14px; color: var(--ink);
  transition: border-color .12s, background .12s, transform .12s;
}
.opt:hover:not(:disabled) { border-color: var(--accent); transform: translateX(2px); }
.opt .key { font-family: "JetBrains Mono", ui-monospace, monospace; font-size: 13px; width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; border: 1px solid var(--line); color: var(--muted); }
.opt:disabled { cursor: default; }
.opt.right { border-color: var(--ok); background: var(--ok-soft); }
.opt.right .key { background: var(--ok); border-color: var(--ok); color: var(--card); }
.opt.wrong { border-color: var(--no); background: var(--no-soft); }
.opt.wrong .key { background: var(--no); border-color: var(--no); color: var(--card); }
.explain { border-top: 1px solid var(--line); padding-top: 16px; display: grid; gap: 4px; }
.explain strong { font-family: "Fraunces", Georgia, serif; font-size: 19px; }
.explain.ok strong { color: var(--ok); }
.explain.no strong { color: var(--no); }
.explain p { margin: 0; color: var(--muted); }
.actions { display: flex; justify-content: flex-end; gap: 10px; flex-wrap: wrap; }
.btn { border: 0; border-radius: 99px; padding: 11px 22px; background: var(--accent); color: var(--accent-ink); font-weight: 600; transition: filter .15s; }
.btn:hover { filter: brightness(1.08); }
.btn.ghost { background: transparent; color: var(--ink); border: 1.5px solid var(--line); }
.btn.ghost:hover { border-color: var(--accent); }

/* Kết quả */
.big { font-family: var(--display); font-size: clamp(64px, 16vw, 104px); line-height: 1; font-variant-numeric: tabular-nums; color: var(--accent); }
.big small { font-size: .4em; color: var(--muted); font-weight: 500; }
.verdict { font-family: "Fraunces", Georgia, serif; font-style: italic; font-size: 22px; margin: 0; }
.breakdown { display: grid; grid-template-columns: repeat(auto-fit, minmax(96px, 1fr)); gap: 8px; }
.breakdown .label { font-size: 11px; }
.breakdown div { border: 1px solid var(--line); border-radius: 12px; padding: 10px 14px; background: var(--opt); display: grid; gap: 2px; }
.breakdown b { font-family: "JetBrains Mono", ui-monospace, monospace; font-size: 18px; font-variant-numeric: tabular-nums; }
.review { display: grid; margin: 0; padding: 0; list-style: none; }
.review li { display: grid; grid-template-columns: 20px 1fr; gap: 10px; font-size: 14px; padding: 10px 0; border-bottom: 1px solid var(--line); }
.review li:last-child { border-bottom: 0; }
.review .mark { font-family: "JetBrains Mono", ui-monospace, monospace; }
.review .mark.ok { color: var(--ok); }
.review .mark.no { color: var(--no); }
.review .ans { color: var(--muted); }
.foot { font-size: 13px; color: var(--muted); border-top: 1px solid var(--line); padding-top: 16px; }
.foot a { color: var(--muted); }
@media (max-width: 480px) { .song { grid-template-columns: 36px 1fr; } .song .no { width: 36px; height: 36px; } .song .go { display: none; } }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body data-theme="home">

<div class="wrap">
  <header class="mast">
    <span class="label">Thư viện câu đố âm nhạc</span>
    <h1>Đố Vui <em>Giai Điệu</em></h1>
    <p>Chọn một ca sĩ, chọn bài hát, rồi kiểm tra xem bạn hiểu bài đến đâu: lời ca nói gì, bài mang giọng điệu nào, và MV được dựng ra sao. Mỗi đáp án đều có giải thích.</p>
    <div class="legend"><span class="tag nd">Nội dung</span><span class="tag gd">Giọng điệu</span><span class="tag mv">Bối cảnh MV</span></div>
  </header>

  <section id="library" aria-label="Chọn ca sĩ">
    <div class="shelf" id="shelf"></div>
  </section>

  <section id="view" class="page" hidden aria-live="polite"></section>

  <footer class="foot" id="foot"></footer>
</div>

<script>
// t: "nd" = Nội dung (lời, thông điệp), "gd" = Giọng điệu (thể loại, cảm xúc, chất giọng), "mv" = Bối cảnh MV
const ARTISTS = [
  {
    id: "son-tung", name: "Sơn Tùng M-TP", initial: "M-TP",
    meta: "Việt Nam · ca sĩ, nhạc sĩ, MTP Entertainment",
    songs: [
      {
        id: "lac-troi", title: "Lạc Trôi", year: 2017, album: "Single",
        sources: [["Wikipedia: Lạc trôi", "https://en.wikipedia.org/wiki/L%E1%BA%A1c_tr%C3%B4i"], ["Vietnam News", "https://vietnamnews.vn/life-style/349067/pop-idol-s-music-video-sees-5-million-youtube-hits-after-one-day.html"], ["VietnamNet", "https://vietnamnet.vn/son-tung-m-tp-hoa-than-thanh-my-nam-co-trang-trong-mv-ma-mi-nhat-su-nghiep-ig21749.html"]],
        questions: [
          { t: "nd", q: "Câu mở đầu \"Người theo hương hoa mây mù giăng lối, làn sương khói phôi phai đưa bước ai xa rồi\" gợi ra điều gì?", a: "Bóng người thương dần khuất xa trong sương khói, để lại người ở lại", w: ["Cảnh lễ hội mùa xuân rộn ràng", "Một chuyến đi chơi vui vẻ cùng bạn bè", "Lời hẹn ước sẽ sớm gặp lại nhau"], e: "Ngay từ câu đầu, bài hát dựng cảnh chia xa mờ ảo: người kia đi theo hương hoa, mây mù, sương khói, còn nhân vật chính ở lại một mình." },
          { t: "nd", q: "Chủ đề cảm xúc xuyên suốt của Lạc Trôi là gì?", a: "Nỗi cô đơn, vấn vương khi người thương đã rời xa", w: ["Niềm vui khi tình yêu được đáp lại", "Lời kêu gọi sống hết mình với tuổi trẻ", "Sự giận dữ muốn trả đũa người cũ"], e: "Nhân vật trong bài lạc lối giữa hồi ức, men say và nỗi nhớ, đúng như tựa đề \"Lạc Trôi\"." },
          { t: "nd", q: "Lời bài hát chủ yếu dùng lớp ngôn từ nào?", a: "Ngôn từ cổ phong, giàu hình ảnh thiên nhiên mờ ảo", w: ["Tiếng lóng đường phố hiện đại", "Toàn bộ là tiếng Anh", "Ngôn ngữ đối thoại hài hước"], e: "Mây mù, sương khói, hương hoa, men say... tạo màu cổ trang khớp với hình ảnh MV." },
          { t: "gd", q: "Về phần phối khí, Lạc Trôi thường được mô tả là sự kết hợp của gì?", a: "Future bass và âm sắc nhạc cụ truyền thống", w: ["Bolero và nhạc đồng quê Mỹ", "Rock nặng và piano cổ điển", "Acoustic guitar mộc hoàn toàn"], e: "Bài hát dùng nền EDM (future bass) pha chất liệu truyền thống. Hòa âm phối khí do Triple D thực hiện." },
          { t: "gd", q: "Không khí chung mà bài hát và MV tạo ra là gì?", a: "Ma mị, hư ảo, u buồn", w: ["Tươi sáng, nhí nhảnh", "Hùng tráng, cổ vũ", "Hài hước, châm biếm"], e: "Báo chí gọi đây là MV \"ma mị nhất sự nghiệp\" của Sơn Tùng, xen giữa thực và ảo." },
          { t: "mv", q: "MV Lạc Trôi được công chiếu vào thời điểm nào?", a: "0 giờ ngày 1/1/2017", w: ["Đêm Giao thừa Tết Nguyên đán 2017", "Ngày Valentine 14/2/2017", "Ngày 1/7/2019"], e: "MV ra mắt đúng khoảnh khắc năm mới dương lịch 2017 và đạt gần 5 triệu lượt xem trong ngày đầu." },
          { t: "mv", q: "Nhiều cảnh trong MV được quay tại ngôi chùa nào?", a: "Chùa Linh Quy Pháp Ấn (Lâm Đồng)", w: ["Chùa Một Cột (Hà Nội)", "Chùa Thiên Mụ (Huế)", "Chùa Bái Đính (Ninh Bình)"], e: "Chùa Linh Quy Pháp Ấn ở Bảo Lâm, Lâm Đồng với khung cảnh mây núi là bối cảnh nổi bật của MV." },
          { t: "mv", q: "Trang phục của Sơn Tùng trong MV có điểm gì gây chú ý?", a: "Áo cổ trang nhưng đi giày sneaker hiện đại", w: ["Mặc vest công sở suốt MV", "Mặc áo dài trắng học sinh", "Mặc đồ phi hành gia"], e: "Sự pha trộn cổ điển và hiện đại thể hiện cả ở trang phục: giày sneaker xuất hiện cùng áo cổ trang." },
          { t: "mv", q: "Lạc Trôi lập kỷ lục nào trên YouTube?", a: "MV EDM Việt đầu tiên đạt 200 triệu lượt xem", w: ["MV Việt đầu tiên đạt 1 tỷ lượt xem", "MV đầu tiên có rapper Mỹ góp giọng", "MV đầu tiên quay bằng máy IMAX"], e: "Lạc Trôi trở thành MV EDM đầu tiên của Việt Nam chạm mốc 200 triệu lượt xem." }
        ]
      },

const COMING = "Bạn muốn ca sĩ nào tiếp theo?";
const CATS = [["all", "Tất cả"], ["nd", "Nội dung"], ["gd", "Giọng điệu"], ["mv", "Bối cảnh MV"]];
const CAT_NAME = { nd: "Nội dung", gd: "Giọng điệu", mv: "Bối cảnh MV" };
const KEYS = ["A", "B", "C", "D"];

const $ = (s) => document.querySelector(s);
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const shuffle = (arr) => { const a = arr.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const store = {
  get(k) { try { return localStorage.getItem(k); } catch { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch {} }
};
const best = {
  get(id) { return Number(store.get("best:" + id)) || 0; },
  set(id, v) { if (v > this.get(id)) store.set("best:" + id, v); }
};
let cat = CATS.some(([k]) => k === store.get("cat")) ? store.get("cat") : "all";
let state = null;

const findArtist = (id) => ARTISTS.find((a) => a.id === id);
const allQs = (artist) => artist.songs.flatMap((s) => s.questions.map((q) => ({ ...q, song: s.title })));
const byCat = (qs, c) => (c === "all" ? qs : qs.filter((q) => q.t === c));
const count = (qs) => qs.length;

function setTheme(id) { document.body.dataset.theme = id; }

function renderShelf() {
  const cards = ARTISTS.map((a) => {
    const n = count(allQs(a));
    return `<button class="artist" data-id="${a.id}" data-theme="${a.id}">
      <span class="cover" aria-hidden="true"><span class="vinyl"></span><span class="initial">${esc(a.initial)}</span></span>
      <span class="body">
        <span class="label">${a.songs.length} bài hát</span>
        <h3>${esc(a.name)}</h3>
        <span class="meta">${esc(a.meta)}</span>
        <span class="row"><span class="pill">${n} câu hỏi</span></span>
      </span>
    </button>`;
  }).join("");
  const soon = `<div class="artist soon" aria-disabled="true"><span class="cover" aria-hidden="true">+</span><span class="body"><span class="label">Sắp có</span><h3>${esc(COMING)}</h3><span class="meta">Ca sĩ và bài hát mới sẽ được thêm vào thư viện.</span></span></div>`;
  $("#shelf").innerHTML = cards + soon;
  $("#shelf").querySelectorAll(".artist[data-id]").forEach((el) => el.addEventListener("click", () => { location.hash = el.dataset.id; }));
}

function showLibrary() {
  state = null;
  setTheme("home");
  $("#view").hidden = true;
  $("#library").hidden = false;
  renderShelf();
  $("#foot").innerHTML = "Thứ tự câu hỏi và đáp án được xáo mỗi lượt. Kỷ lục chỉ lưu trên trình duyệt của bạn.";
}

function topbar(left, right) {
  return `<div class="topbar"><button class="back" id="back">${left}</button><span class="label">${esc(right)}</span></div>`;
}

function renderArtist(artist) {
  state = null;
  setTheme(artist.id);
  $("#library").hidden = true;
  $("#view").hidden = false;
  const all = allQs(artist);
  const chips = CATS.map(([k, n]) => `<button class="chip" data-cat="${k}" aria-pressed="${k === cat}">${n}<small>${count(byCat(all, k))}</small></button>`).join("");
  const rows = artist.songs.map((s, k) => {
    const n = count(byCat(s.questions.map((q) => q), cat));
    const b = best.get(`${artist.id}/${s.id}/${cat}`);
    return `<li><button class="song" data-song="${s.id}" ${n ? "" : "disabled"}>
      <span class="no">${String(k + 1).padStart(2, "0")}</span>
      <span><h3>${esc(s.title)}</h3><span class="sub">${s.year} · ${esc(s.album)} · ${n} câu${b ? ` · kỷ lục ${b}/${n}` : ""}</span></span>
      <span class="go">Chơi →</span>
    </button></li>`;
  }).join("");
  $("#view").innerHTML = `
    ${topbar("← Tất cả ca sĩ", artist.meta)}
    <div class="hero"><span class="label">Ca sĩ</span><h1>${esc(artist.name)}</h1><p>Chọn nhóm câu hỏi, rồi chọn một bài hát để bắt đầu.</p></div>
    <div class="filter"><span class="label">Nhóm câu hỏi</span><div class="chips" role="group" aria-label="Nhóm câu hỏi">${chips}</div></div>
    <ul class="tracks">
      ${rows}
    </ul>`;
  $("#back").addEventListener("click", () => { location.hash = ""; });
  $("#view").querySelectorAll(".chip").forEach((b) => b.addEventListener("click", () => { cat = b.dataset.cat; store.set("cat", cat); renderArtist(artist); }));
  $("#view").querySelectorAll(".song").forEach((b) => b.addEventListener("click", () => { location.hash = `${artist.id}/${b.dataset.song}/${cat}`; }));
  $("#foot").innerHTML = `Nguồn dữ kiện: ${artist.songs.flatMap((s) => s.sources).map(([n, u]) => `<a href="${u}" target="_blank" rel="noopener">${esc(n)}</a>`).join(", ")}.`;
  window.scrollTo(0, 0);
}

function start(artist, songId, c) {
  const song = artist.songs.find((s) => s.id === songId);
  const qs = shuffle(byCat(song.questions, c)).map((x) => ({ ...x, opts: shuffle([x.a, ...x.w]) }));
  if (!qs.length) return renderArtist(artist);
  state = { artist, song, c, key: `${artist.id}/${songId}/${c}`, qs, i: 0, picks: [] };
  setTheme(artist.id);
  $("#library").hidden = true;
  $("#view").hidden = false;
  $("#foot").innerHTML = `Nguồn dữ kiện: ${song.sources.map(([n, u]) => `<a href="${u}" target="_blank" rel="noopener">${esc(n)}</a>`).join(", ")}.`;
  renderQ();
  window.scrollTo(0, 0);
}

function title() { return state.song.title; }
function sub() { return `${state.artist.name} · ${CATS.find(([k]) => k === state.c)[1]}`; }

function trk() {
  return `<div class="trk" aria-hidden="true">${state.qs.map((q, k) => {
    const p = state.picks[k];
    const cls = p === undefined ? (k === state.i ? "now" : "") : (p === q.a ? "ok" : "no");
    return `<span class="${cls}"></span>`;
  }).join("")}</div>`;
}
function correct(list) { return (list || state.qs).filter((q) => state.picks[state.qs.indexOf(q)] === q.a).length; }

function renderQ() {
  const { qs, i } = state;
  const q = qs[i];
  const picked = state.picks[i];
  const done = picked !== undefined;
  const ok = picked === q.a;
  $("#view").innerHTML = `
    ${topbar(`← ${esc(state.artist.name)}`, sub())}
    <div class="hero"><span class="label">${state.song.year} · ${esc(state.song.album)}</span><h1>${esc(title())}</h1></div>
    ${trk()}
    <article class="card">
      <div class="qhead"><span class="left"><span class="num">Câu ${String(i + 1).padStart(2, "0")} / ${qs.length}</span><span class="tag ${q.t}">${CAT_NAME[q.t]}</span></span><span class="score">Đúng ${correct()}</span></div>
      <h2 class="q">${esc(q.q)}</h2>
      <div class="opts">${q.opts.map((o, k) => {
        let cls = "";
        if (done && o === q.a) cls = "right";
        else if (done && o === picked) cls = "wrong";
        return `<button class="opt ${cls}" data-k="${k}" ${done ? "disabled" : ""}><span class="key">${KEYS[k]}</span><span>${esc(o)}</span></button>`;
      }).join("")}</div>
      ${done ? `<div class="explain ${ok ? "ok" : "no"}"><strong>${ok ? "Chính xác!" : "Chưa đúng. Đáp án: " + esc(q.a)}</strong><p>${esc(q.e)}</p></div>
      <div class="actions"><button class="btn" id="next">${i + 1 < qs.length ? "Câu tiếp theo →" : "Xem kết quả"}</button></div>` : ""}
    </article>`;
  $("#back").addEventListener("click", () => { location.hash = state.artist.id; });
  $("#view").querySelectorAll(".opt:not(:disabled)").forEach((b) => b.addEventListener("click", () => pick(q.opts[Number(b.dataset.k)])));
  const nx = $("#next");
  if (nx) { nx.addEventListener("click", next); nx.focus({ preventScroll: true }); }
}

function pick(o) {
  if (state.picks[state.i] !== undefined) return;
  state.picks[state.i] = o;
  renderQ();
}
function next() {
  if (state.i + 1 < state.qs.length) { state.i++; renderQ(); }
  else renderResult();
}

function verdict(r) {
  if (r === 1) return "Fan cứng chính hiệu. Bạn thuộc từng câu hát, từng khung hình.";
  if (r >= .75) return "Rất ấn tượng. Bạn nghe kỹ và xem MV kỹ.";
  if (r >= .5) return "Khá ổn. Nghe lại vài lần và xem lại MV là thành fan cứng.";
  return "Đến lúc bật lại bài hát và xem MV rồi.";
}

function renderResult() {
  const { qs } = state;
  const c = correct();
  best.set(state.key, c);
  const groups = ["nd", "gd", "mv"].map((t) => [t, qs.filter((q) => q.t === t)]).filter(([, l]) => l.length);
  $("#view").innerHTML = `
    ${topbar(`← ${esc(state.artist.name)}`, sub())}
    <div class="hero"><span class="label">Kết quả</span><h1>${esc(title())}</h1></div>
    ${trk()}
    <article class="card">
      <div class="big">${c}<small> / ${qs.length}</small></div>
      <p class="verdict">${verdict(c / qs.length)}</p>
      ${groups.length > 1 ? `<div class="breakdown">${groups.map(([t, l]) => `<div><span class="label">${CAT_NAME[t]}</span><b>${correct(l)} / ${l.length}</b></div>`).join("")}</div>` : ""}
      <ul class="review">${qs.map((q, k) => {
        const ok = state.picks[k] === q.a;
        return `<li><span class="mark ${ok ? "ok" : "no"}">${ok ? "✓" : "✗"}</span><span>${esc(q.q)}<br><span class="ans">${ok ? esc(q.a) : `Bạn chọn ${esc(state.picks[k])} · Đáp án ${esc(q.a)}`}</span></span></li>`;
      }).join("")}</ul>
      <div class="actions">
        <button class="btn ghost" id="lib">Chọn bài khác</button>
        <button class="btn" id="again">Chơi lại</button>
      </div>
    </article>`;
  $("#back").addEventListener("click", () => { location.hash = state.artist.id; });
  $("#lib").addEventListener("click", () => { location.hash = state.artist.id; });
  $("#again").addEventListener("click", () => start(state.artist, state.song.id, state.c));
  window.scrollTo(0, 0);
}

function route() {
  const [aid, sid, c] = location.hash.slice(1).split("/");
  const artist = findArtist(aid);
  if (!artist) return showLibrary();
  if (!sid) return renderArtist(artist);
  const cc = CATS.some(([k]) => k === c) ? c : "all";
  if (!artist.songs.some((s) => s.id === sid)) return renderArtist(artist);
  cat = cc;
  start(artist, sid, cc);
}

document.addEventListener("keydown", (e) => {
  if (!state || $("#view").hidden) return;
  const k = KEYS.indexOf(e.key.toUpperCase());
  const btns = $("#view").querySelectorAll(".opt:not(:disabled)");
  if (k >= 0 && btns[k]) btns[k].click();
});
window.addEventListener("hashchange", route);
route();
</script>
</body>
